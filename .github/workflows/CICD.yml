name: CI - Build, Test, Push Docker Image & Update README

on:
  push:
    branches-ignore:
      - main   
  pull_request:
    branches:
      - main

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      # 1️ Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # لازم عشان نقدر نجيب الـ tags السابقة

      # 2️ Set up .NET SDK
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      # 3️ Restore dependencies
      - name: Restore dependencies
        run: dotnet restore src/Rafiq.API.csproj

      # 4️ Lint (تحليل الكود)
      - name: Run Linter
        run: dotnet format --verify-no-changes || echo "::warning::Code formatting issues detected"

      # 5️⃣ Build
      - name: Build
        run: dotnet build src/Rafiq.API.csproj --configuration Release --no-restore

      # 6️ Unit Tests + Coverage
      - name: Run Unit Tests with Coverage
        run: |
          dotnet test src/Rafiq.API.csproj --configuration Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=./TestResults/coverage.cobertura.xml

      # 7️ Generate HTML Coverage Report
      - name: Generate Coverage Report
        if: success() && hashFiles('TestResults/coverage.cobertura.xml') != ''
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:/home/runner/.dotnet/tools"
          reportgenerator \
            -reports:"TestResults/coverage.cobertura.xml" \
            -targetdir:"TestResults/coverage-report" \
            -reporttypes:Html

      # 8️ Upload Coverage HTML Report
      - name: Upload Coverage HTML Report
        if: success() && hashFiles('TestResults/coverage-report/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage-report

      # 9️ Publish build output
      - name: Publish
        run: dotnet publish src/Rafiq.API.csproj --configuration Release --output ./out --no-build

      # 10 Generate next semantic version tag
      - name: Generate Semantic Version Tag
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          tag_prefix: "v"
          default_bump: patch  # v1.0.0 → v1.0.1

      # 1️1 Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/myapp:${{ steps.semver.outputs.new_tag }} .

      # 12 Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 13 Push Docker Image with version tag
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:${{ steps.semver.outputs.new_tag }}

      # 14 Tag and Push "latest"
      - name: Tag and Push Latest
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/myapp:${{ steps.semver.outputs.new_tag }} \
                     ${{ secrets.DOCKER_USERNAME }}/myapp:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:latest

      # 15 Update README.md with new version
      - name: Update README with new version
        run: |
          sed -i "s/{{VERSION}}/${{ steps.semver.outputs.new_tag }}/g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README with new version ${{ steps.semver.outputs.new_tag }}"
          git push

      # 16 Show New Tag Info
      - name: Show New Tag Info
        run: echo "New version published: ${{ steps.semver.outputs.new_tag }} (also tagged as latest)"
