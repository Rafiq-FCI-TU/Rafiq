name: OpenAPI Specification and Documentation
permissions:
  contents: write

on:
  push:
    branches:
      - "main"
    paths:
      - "**/*.cs"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to generate docs from"
        required: false
        default: "main"

jobs:
  redocly:
    name: Generate Redocly docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          persist-credentials: true 

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare docs folder
        run: rm -rf docs && mkdir docs

      - name: Run API
        run: dotnet run --project src/Web/Rafiq.API/Rafiq.API.csproj --urls http://0.0.0.0:5000 &

      - name: Wait for API
        run: |
           for i in {1..12}; do
             if curl -s http://localhost:5000/swagger/v1/swagger.json -o docs/swagger.json; then
               echo "API is up!"
               break
             fi
             echo "Waiting for API to start..."
             sleep 5
           done

      - name: Install Redocly CLI
        run: npm install -g @redocly/openapi-cli

      - name: Generate documentation
        run: npx @redocly/cli build-docs docs/swagger.json -o docs/index.html

      - name: Commit & push to branch 
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: docs/**
          commit_user_name: GitHub Actions
          commit_user_email: actions@github.com
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: "--signoff"
          commit_message: "[Docs] Update API documentation"
          create_branch: true
          branch: docs-auto-update-${{ github.run_id }}
          push_options: '--set-upstream'
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "[Docs] Update API documentation"
          branch: docs-auto-update-${{ github.run_id }}
          base: main
          title: "[Docs] Update API documentation"
          body: "Automated update of Swagger docs"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          draft: false
          delete-branch: false
