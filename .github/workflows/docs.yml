name: OpenAPI Specification and Documentation
permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - "main"
    paths:
      - "**/*.cs"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to generate docs from"
        required: false
        default: "main"

jobs:
  redocly:
    name: Generate Redocly docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build project
        run: dotnet build src/Web/Rafiq.API/Rafiq.API.csproj -c Debug

      - name: Install Swashbuckle CLI
        run: dotnet tool install -g Swashbuckle.AspNetCore.Cli

      - name: Prepare docs folder
        run: rm -rf docs && mkdir docs

      - name: Generate swagger.json
        run: |
          swagger tofile \
            --output docs/swagger.json \
            src/Web/Rafiq.API/bin/Debug/net8.0/Rafiq.API.dll \
            v1

      - name: Generate Redocly HTML
        run: npx @redocly/cli build-docs docs/swagger.json -o docs/index.html

      - name: Commit & push to branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: docs/**
          commit_user_name: GitHub Actions
          commit_user_email: actions@github.com
          commit_message: "[Docs] Update API documentation"
          create_branch: true
          branch: docs-auto-update-${{ github.run_id }}
          push_options: '--set-upstream'

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: docs-auto-update-${{ github.run_id }}
          base: main
          title: "[Docs] Update API documentation"
          body: "Automated update of Swagger docs"
          draft: false
