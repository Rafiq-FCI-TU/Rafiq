name: OpenAPI Specification and Documentation

on:
  push:
    branches:
      - "main"
    paths:
      - "**/*.cs"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to generate docs from"
        required: false
        default: "main"

jobs:
  redocly:
    name: Generate Redocly docs
    runs-on: ubuntu-latest

    steps:
      # Checkout the selected branch
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      # Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Run API in background
      - name: Run API
        run: dotnet run --project src/Web/Rafiq.API/Rafiq.API.csproj --urls http://0.0.0.0:5000 &

      - name: Wait for API
        run: |
           for i in {1..10}; do
           curl http://localhost:5000/swagger/v1/swagger.json -o docs/swagger.json && break
           echo "Waiting for API to start..."
           sleep 5
           done

      # Download Swagger JSON
      - name: Download Swagger JSON
        run: curl http://localhost:5000/swagger/v1/swagger.json -o docs/swagger.json

      # Install Redocly CLI
      - name: Install Redocly
        run: npm install -g @redocly/openapi-cli

      # Build documentation
      - name: Generate documentation
        run: npx @redocly/cli build-docs docs/swagger.json -o docs/index.html

      # Commit docs
      - name: Commit docs
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: docs/**
          commit_user_name: YourName
          commit_user_email: your-email@example.com
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: "--signoff"
          commit_message: "[Docs] Update API documentation"


