name: OpenAPI Specification and Documentation
permissions:
  contents: write

on:
  push:
    branches:
      - "main"
    paths:
      - "**/*.cs"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to generate docs from"
        required: false
        default: "main"

jobs:
  redocly:
    name: Generate Redocly docs
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          persist-credentials: true

      # 2️⃣ Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 3️⃣ Prepare docs folder
      - name: Prepare docs folder
        run: rm -rf docs && mkdir docs

      # 4️⃣ Run API in background
      - name: Run API
        run: dotnet run --project src/Web/Rafiq.API/Rafiq.API.csproj --urls http://0.0.0.0:5000 &

      # 5️⃣ Wait for API to start
      - name: Wait for API
        run: |
           for i in {1..12}; do
             curl http://localhost:5000/swagger/v1/swagger.json -o docs/swagger.json && break
             echo "Waiting for API to start..."
             sleep 5
           done

      # 6️⃣ Install Redocly CLI
      - name: Install Redocly
        run: npm install -g @redocly/openapi-cli

      # 7️⃣ Build documentation
      - name: Generate documentation
        run: npx @redocly/cli build-docs docs/swagger.json -o docs/index.html

      # 8️⃣ Commit & push to branch 
      - name: Commit docs
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: docs/**
          commit_user_name: GitHub Actions
          commit_user_email: actions@github.com
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: "--signoff"
          commit_message: "[Docs] Update API documentation"
          create_branch: true
          branch: docs-auto-update-${{ github.run_id }}
          push_options: '--set-upstream'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "[Docs] Update API documentation"
          branch: docs-auto-update-${{ github.run_id }}
          base: main
          title: "[Docs] Update API documentation"
          body: "Automated update of Swagger docs"
          committer: GitHub <noreply@github.com>
          author: abdulrahman11a <abdulrahman11a@users.noreply.github.com>
          signoff: false
          draft: false
          delete-branch: false
      


