name: OpenAPI Specification and Documentation
permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - "main"
    paths:
      - "**/*.cs"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to generate docs from"
        required: false
        default: "main"

jobs:
  redocly:
    name: Generate Redocly docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare docs folder
        run: |
          rm -rf docs
          mkdir docs

      - name: Run API
        run: dotnet run --project src/Web/Rafiq.API/Rafiq.API.csproj --urls http://0.0.0.0:5000 &

      - name: Wait for API
        run: |
          for i in {1..12}; do
            if curl -s http://localhost:5000/swagger/v1/swagger.json -o docs/swagger.json; then
              echo "API is up!"
              break
            fi
            echo "Waiting for API to start..."
            sleep 5
          done

      - name: Install Redocly CLI
        run: npm install -g @redocly/openapi-cli

      - name: Generate documentation
        run: npx @redocly/cli build-docs docs/swagger.json -o docs/index.html

      - name: Commit & push to branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -b docs-auto-update-${{ github.run_id }}
          git add docs/
          git diff --staged --quiet || git commit -m "[Docs] Update API documentation"
          git push origin docs-auto-update-${{ github.run_id }} --set-upstream

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh pr create \
            --repo ${{ github.repository }} \
            --title "[Docs] Update API documentation" \
            --body "Automated update of Swagger docs" \
            --base main \
            --head docs-auto-update-${{ github.run_id }}
