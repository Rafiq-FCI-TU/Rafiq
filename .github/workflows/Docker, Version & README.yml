name: CI - Docker & Update README

on:
  workflow_run:
    workflows: ["CI - Build & Test"]
    types:
      - completed

permissions:
  contents: write
  packages: write

jobs:
  docker-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate Semantic Version Tag
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          tag_prefix: "v"
          default_bump: patch

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/myapp:${{ steps.semver.outputs.new_tag }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/myapp:${{ steps.semver.outputs.new_tag }}

      - name: Tag and Push Latest
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/myapp:${{ steps.semver.outputs.new_tag }} \
                     ${{ secrets.DOCKER_USERNAME }}/myapp:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:latest

      - name: Update README with new version
        run: |
          sed -i "s/{{VERSION}}/${{ steps.semver.outputs.new_tag }}/g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README with new version ${{ steps.semver.outputs.new_tag }}"
          git push
