name: CI - Build & Test

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Web/Rafiq.API/Rafiq.API.csproj
        
      - name: Run Linter
        run: dotnet format --verify-no-changes || echo "::warning::Code formatting issues detected"

      - name: Build
        run: dotnet build src/Web/Rafiq.API/Rafiq.API.csproj --configuration Release --no-restore

      - name: Run Unit Tests with Coverage
        run: |
          dotnet test src/Web/Rafiq.API/Rafiq.API.csproj --configuration Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=./TestResults/coverage.cobertura.xml

      - name: Generate Coverage Report
        if: success() && hashFiles('TestResults/coverage.cobertura.xml') != ''
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:/home/runner/.dotnet/tools"
          reportgenerator \
            -reports:"TestResults/coverage.cobertura.xml" \
            -targetdir:"TestResults/coverage-report" \
            -reporttypes:Html

      - name: Upload Coverage HTML Report
        if: success() && hashFiles('TestResults/coverage-report/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage-report
          
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
